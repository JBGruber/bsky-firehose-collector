services:
  collector:
    image: jbgruber/bsky-firehose-collector:20260910
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collector
    hostname: collector
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - data:/app/data
    environment:
      NODE_ENV: production
      COLLECTOR_SUBSCRIPTION_ENDPOINT: wss://bsky.network
      # base reconnect delay; retries back off exponentially with jitter up to
      # COLLECTOR_RECONNECT_MAX_DELAY_MS
      COLLECTOR_SUBSCRIPTION_RECONNECT_DELAY: 3000
      COLLECTOR_RECONNECT_MAX_DELAY_MS: 300000
      # health endpoint + the lag ceiling above which it reports unhealthy
      COLLECTOR_PORT: 3000
      COLLECTOR_MAX_LAG_MS: 600000
      COLLECTOR_STATS_INTERVAL_MS: 60000
      # Part D -- the fallback ladder. Shed the least valuable stream first, and
      # record every transition in collection_gap. Rung 3 writes batches to
      # NDJSON under COLLECTOR_DATA_DIR instead of Postgres; reconcile them with
      # `docker compose exec collector node dist/backfill.js`. A database that
      # cannot be written to also lands on rung 3, but sheds nothing.
      COLLECTOR_DATA_DIR: /app/data
      COLLECTOR_SHED_LIKES_LAG_MS: 60000
      COLLECTOR_SHED_REPOSTS_LAG_MS: 300000
      COLLECTOR_SPILL_LAG_MS: 900000
      # how long lag has to stay down before stepping back up one rung
      COLLECTOR_LADDER_RECOVER_MS: 120000
      # Database connection details
      COLLECTOR_DB_HOST: collector-db
      COLLECTOR_DB_PORT: 5432
      COLLECTOR_DB_USER: collector
      COLLECTOR_DB_PASSWORD: ${db_pw:-collector}
      COLLECTOR_DB_DATABASE: collector-db
    depends_on:
      collector-db:
        condition: service_healthy
    # NB: plain docker/compose does not restart an unhealthy container -- this
    # makes a wedged collector visible to `docker ps` and to any external
    # watchdog, it does not act on it by itself.
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get({host:'127.0.0.1',port:3000,path:'/health'},s=>process.exit(s.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  collector-db:
    image: postgres:17
    container_name: collector-db
    hostname: collector-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    logging:
      options:
        max-size: 10m
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: collector-db
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${db_pw:-collector}
    shm_size: 2gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector-db"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_workers=8
      # Write path. The default max_wal_size=1GB forces a checkpoint every few
      # minutes under firehose load, and each one is a write stall.
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      # Safe now that the cursor is committed in the same transaction as the
      # rows: an unclean shutdown loses well under a second of firehose data,
      # and the stream replays it from the last committed cursor.
      - -c
      - synchronous_commit=off
      # Sustained inserts generate dead tuples faster than the default
      # autovacuum pacing can keep up with.
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_naptime=15s

volumes:
  data:
  db: